 <title id="pc-figure-title">Confirmed observations by county</title>
 <desc id="pc-figure-desc">Two bars compare confirmed ground observations from 2016–2025: Weld County 773 and Larimer County 1,071, totaling 1,844. This is a count of observations, not an area-normalized hail-risk comparison.</desc>
