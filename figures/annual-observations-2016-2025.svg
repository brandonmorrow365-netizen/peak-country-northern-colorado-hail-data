 <title id="pc-figure-title">Annual confirmed hail observations</title>
 <desc id="pc-figure-desc">Bar chart of 10 annual confirmed hail-observation counts in Weld and Larimer Counties, 2016–2025. The highest count is 343 in 2018; the lowest is 65 in 2022. Counts describe observations, not changing hail frequency or climate trends.</desc>
