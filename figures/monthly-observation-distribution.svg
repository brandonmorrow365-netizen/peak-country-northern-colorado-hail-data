 <title id="pc-figure-title">Observations by calendar month</title>
 <desc id="pc-figure-desc">Bar chart of observations aggregated by calendar month over 2016–2025. May has 515 observations, June 453 and July 386, while November has none. Counts reflect the assembled reports, not a climate trend or uniform reporting coverage.</desc>
