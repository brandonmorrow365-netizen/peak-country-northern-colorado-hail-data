 <title id="pc-figure-title">Distance from Greeley geographic reference</title>
 <desc id="pc-figure-desc">Six distance bins for 1,844 observations measured by WGS84 geodesic distance from the fixed neutral Lincoln Park, Greeley reference: 0–5 miles 168, over 5–10 miles 109, over 10–15 miles 130, over 15–20 miles 156, over 20–25 miles 501, and outside 25 miles 780. The reference is methodological, not a business address.</desc>
