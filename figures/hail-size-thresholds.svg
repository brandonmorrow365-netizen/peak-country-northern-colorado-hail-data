 <title id="pc-figure-title">Ground-reported hail size thresholds</title>
 <desc id="pc-figure-desc">Three overlapping ground-reported hail-size thresholds: 588 observations at least 1 inch, 238 at least 1.5 inches, and 65 at least 2 inches. The thresholds are nested, not mutually exclusive; radar-only estimates are excluded.</desc>
